spring.application.name=admin-jsf
spring.profiles.active=local

# Porta diferente do api-java (8080) e do apps/web (3000)
server.port=8081

# Modo de desenvolvimento do JSF: mensagens de erro mais detalhadas
joinfaces.faces.project-stage=Development

# Tema visual do PrimeFaces
joinfaces.faces.primefaces.theme=saga

# So leitura: o Hibernate nunca cria/altera a tabela documentos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false